name: FilePilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build-test:
    name: Windows / MinGW / Qt 6
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6 and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          host: windows
          target: desktop
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Configure toolchain paths
        shell: pwsh
        run: |
          $qtInstallRoot = Split-Path (Split-Path $env:QT_ROOT_DIR)
          $mingwBin = Join-Path $qtInstallRoot "Tools\mingw1310_64\bin"
          if (Test-Path $mingwBin) {
            $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          $env:QT_ROOT_DIR | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-mingw-release

      - name: Build
        shell: pwsh
        run: cmake --build --preset release --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --preset release --output-on-failure
